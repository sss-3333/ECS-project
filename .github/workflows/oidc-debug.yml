name: OIDC Debug

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and decode OIDC token
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')

          # JWTs are base64url-encoded, three dot-separated parts: header.payload.signature
          PAYLOAD=$(echo "$TOKEN" | cut -d "." -f2)
          # pad base64 string to a multiple of 4 chars, base64url -> base64, then decode
          PADDED=$(printf '%s' "$PAYLOAD" | tr '_-' '/+')
          MOD=$(( ${#PADDED} % 4 ))
          if [ $MOD -eq 2 ]; then PADDED="${PADDED}=="; fi
          if [ $MOD -eq 3 ]; then PADDED="${PADDED}="; fi

          echo "$PADDED" | base64 -d | jq .