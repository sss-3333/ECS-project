name: Build and Push

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
  workflow_dispatch: {}

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: ecs-project-tracker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: docker build -t $ECR_REPOSITORY:${{ github.sha }} .

      - name: Tag and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker tag $ECR_REPOSITORY:${{ github.sha }} $REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Job summary
        run: |
          echo "### Image pushed :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: \`$ECR_REPOSITORY\`" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
